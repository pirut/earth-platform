# The Fabric build of Earth Platform. Its version, ids and Minecraft version come from
# ../minecraft/gradle.properties, so one bump there releases both jars.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false
org.gradle.workers.max=2

# Compile against the oldest Fabric Loader the jar accepts: newer loaders bring a Mixin that writes
# @Redirect's @At as an array, which older loaders' MixinExtras can't read.
loader_version=0.16.14
loader_version_range=>=0.16.14
fabric_api_version=0.116.17+1.21.1
# Range the jar accepts at runtime: any 1.21.1 Fabric API from the one the mod's hooks first shipped in
fabric_api_version_range=>=0.116.0
# NeoForge's config system on Fabric, bundled in the jar so the TOML files and the config screen match
forge_config_api_port_version=21.1.6
