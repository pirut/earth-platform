allprojects { p ->
 p.plugins.withId('net.neoforged.moddev') { p.afterEvaluate {
  def run = p.file('run-native-codec-boundary-003')
  if(run.exists()) throw new GradleException('Fresh one-shot codec boundary directory required')
  p.extensions.getByName('neoForge').runs.named('survivalGameTest').configure {
   gameDirectory = run
   systemProperty 'earthplatform.nativeCodecBoundaryProbe','true'
   systemProperty 'earthplatform.nativeConnectionOutputProbe','false'
   systemProperty 'earthplatform.nativeOutputTransformProbe','false'
   systemProperty 'neoforge.gameTestServer','true'
   systemProperty 'neoforge.enabledGameTestNamespaces','earthplatform_codec_probe'
   programArguments.addAll('--universe','.', '--world','world')
  }
 } }
}
