// Additive parent evidence only. Runs after original dependencies, immediately before JavaExec.
import groovy.json.JsonOutput
import java.nio.file.Files
import java.nio.file.StandardOpenOption
import java.security.MessageDigest
allprojects { p ->
 p.plugins.withId('net.neoforged.moddev') { p.afterEvaluate {
  p.tasks.named('runSurvivalGameTest').configure { task ->
   doFirst {
    if (!(task instanceof JavaExec)) throw new GradleException('Expected original JavaExec run task')
    def evidence = p.file('../review-evidence/native-carrier-read-continuation-batch-4/pre-java-inputs')
    if (!evidence.mkdir()) throw new GradleException('Fresh pre-Java input receipt required')
    def sha = { byte[] bytes -> HexFormat.of().formatHex(MessageDigest.getInstance('SHA-256').digest(bytes)) }
    def names = ['survivalGameTestRunVmArgs.txt','survivalGameTestRunProgramArgs.txt','survivalGameTestLegacyClasspath.txt','survivalGameTestLog4j2.xml']
    def files = []
    for (name in names) {
     def source = p.layout.buildDirectory.file('moddev/' + name).get().asFile
     if (!source.isFile() || source.length() > 2L * 1024 * 1024) throw new GradleException('Missing or oversized original prepared input: ' + name)
     byte[] bytes = Files.readAllBytes(source.toPath())
     Files.write(new File(evidence,name).toPath(),bytes,StandardOpenOption.CREATE_NEW,StandardOpenOption.WRITE)
     files.add([source:source.canonicalPath,copy:name,bytes:bytes.length,sha256:sha(bytes)])
    }
    // Bind artifacts selected by these exact newly prepared argument files.
    def artifactPaths = new TreeSet<String>()
    def addArtifact = { String value ->
     if (value.length() > 4096 || !new File(value).isAbsolute()) throw new GradleException('Unexpected prepared artifact path')
     def file = new File(value).canonicalFile
     if (!file.isFile() || file.length() > 512L * 1024 * 1024) throw new GradleException('Missing or oversized prepared artifact')
     if (!artifactPaths.contains(file.path) && artifactPaths.size() >= 256) throw new GradleException('Prepared artifact count exceeded')
     artifactPaths.add(file.path)
    }
    def vmLines = new File(evidence,'survivalGameTestRunVmArgs.txt').readLines('UTF-8')
    def cpLines = new File(evidence,'survivalGameTestLegacyClasspath.txt').readLines('UTF-8')
    if (vmLines.size() > 4096 || cpLines.size() > 4096) throw new GradleException('Prepared argument line count exceeded')
    for (int i=0;i<vmLines.size();i++) {
     if (vmLines[i] == '-p' || vmLines[i] == '--module-path') {
      if (++i >= vmLines.size()) throw new GradleException('Missing module-path value')
      for (String value : vmLines[i].split(java.io.File.pathSeparator)) addArtifact(value)
     }
    }
    for (String value : cpLines) if (value.endsWith('.jar')) addArtifact(value)
    for (File file : task.classpath.files) if (file.name.endsWith('.jar')) addArtifact(file.canonicalPath)
    def artifactRows=[]
    byte[] buffer=new byte[65536]
    for (String path : artifactPaths) {
     def file=new File(path)
     def before=Files.readAttributes(file.toPath(),java.nio.file.attribute.BasicFileAttributes.class,java.nio.file.LinkOption.NOFOLLOW_LINKS)
     if (!before.isRegularFile() || before.size() > 512L*1024*1024 || before.fileKey()==null) throw new GradleException('Prepared artifact identity unavailable')
     long bytes=0;def digest=MessageDigest.getInstance('SHA-256')
     file.withInputStream { input ->
      int count
      while (bytes < 512L*1024*1024 && (count=input.read(buffer,0,(int)Math.min((long)buffer.length,512L*1024*1024-bytes))) != -1) {
       bytes+=count;if (bytes > 512L*1024*1024) throw new GradleException('Prepared artifact grew past bound')
       digest.update(buffer,0,count)
      }
     }
     def after=Files.readAttributes(file.toPath(),java.nio.file.attribute.BasicFileAttributes.class,java.nio.file.LinkOption.NOFOLLOW_LINKS)
     if (!after.isRegularFile() || bytes != before.size() || bytes != after.size() || before.fileKey()!=after.fileKey() || before.lastModifiedTime()!=after.lastModifiedTime()) throw new GradleException('Prepared artifact changed identity/size/time')
     artifactRows.add([path:path,bytes:bytes,sha256:HexFormat.of().formatHex(digest.digest()),fileKey:before.fileKey().toString(),modified:before.lastModifiedTime().toString(),identityUnchanged:true])
    }
    def receipt = [scope:'Original carrier read JavaExec task snapshot after preparation; no task/flag/runtime mutation',taskPath:task.path,
     mainClass:task.mainClass.get(),executable:task.executable,workingDirectory:task.workingDir.canonicalPath,
     jvmArgs:task.jvmArgs.collect { it.toString() },allJvmArgs:task.allJvmArgs.collect { it.toString() },
     programArgs:task.args.collect { it.toString() },classPath:task.classpath.files.collect { it.canonicalPath },files:files,preparedArtifacts:artifactRows]
    byte[] out = (JsonOutput.prettyPrint(JsonOutput.toJson(receipt))+'\n').getBytes('UTF-8')
    if (out.length > 2 * 1024 * 1024) throw new GradleException('Prepared task receipt exceeds fixed bound')
    Files.write(new File(evidence,'receipt.json').toPath(),out,StandardOpenOption.CREATE_NEW,StandardOpenOption.WRITE)
    println('CARRIER_READ_PRE_JAVA_INPUTS_BOUND sha256='+sha(out))
   }
  }
 } }
}
