# This is an example neoforge.mods.toml file. It contains the data relating to the loading mods.
# There are several mandatory fields (#mandatory), and many more that are optional (#optional).
# The overall format is standard TOML format, v0.5.0.
# Note that there are a couple of TOML lists in this file.
# Find more information on toml format here:  https://github.com/toml-lang/toml

# The name of the mod loader type to load - for regular FML @Mod mods it should be javafml
modLoader="javafml" #mandatory

# A version range to match for said mod loader - for regular FML @Mod it will be the FML version. This is currently 2.
loaderVersion="${loader_version_range}" #mandatory

# The mod's licence as an SPDX id, from mod_license in gradle.properties (LGPL-3.0-only).
license="${mod_license}"

# Lithium speeds these up by reading LevelChunk sections directly. In the Earth world those carrier
# chunks are 16 blocks tall and empty (blocks live in cubes), so players and mobs fell through the
# ground, and rays, explosions, redstone, hoppers and block patterns would miss blocks. Lithium reads
# this from every installed mod and turns these features off; everything else in Lithium stays on.
"lithium:options" = { "mixin.entity.collisions.movement" = false, "mixin.entity.collisions.intersection" = false, "mixin.world.raycast" = false, "mixin.world.explosions.block_raycast" = false, "mixin.world.inline_block_access" = false, "mixin.block.redstone_wire" = false, "mixin.block_pattern_matching" = false, "mixin.ai.non_poi_block_search" = false, "mixin.ai.poi.fast_portals" = false, "mixin.entity.inactive_navigations" = false, "mixin.util.block_entity_retrieval" = false }

# A URL to refer people to when problems occur with this mod
#issueTrackerURL="https://change.me.to.your.issue.tracker.example.invalid/" #optional

# A list of mods - how many allowed here is determined by the individual mod loader
[[mods]] #mandatory

# The modid of the mod
modId="${mod_id}" #mandatory

# The version number of the mod
version="${mod_version}" #mandatory

# A display name for the mod
displayName="${mod_name}" #mandatory

# A URL to query for updates for this mod. See the JSON update specification https://docs.neoforged.net/docs/misc/updatechecker/
#updateJSONURL="https://change.me.example.invalid/updates.json" #optional

# A URL for the "homepage" for this mod, displayed in the mod UI
#displayURL="https://change.me.to.your.mods.homepage.example.invalid/" #optional

# A file name (in the root of the mod JAR) containing a logo for display
logoFile="earthplatform_logo.png" #optional
logoBlur=false

# A text field displayed in the mod UI
credits='''Earth Platform would not be possible without the open data below. Thank you to every agency, scientist and team who collected it and shared it.
Earth data, downloaded while you play and kept on your computer:
Elevation: AWS Terrain Tiles (Mapzen/Tilezen terrain on the Registry of Open Data on AWS). Sources and credits: ArcticDEM (DigitalGlobe imagery, NSF awards 1043681, 1559691, 1542736); Australia © Commonwealth of Australia (Geoscience Australia) 2017; Austria © offene Daten Österreichs, Digitales Geländemodell (DGM) Österreich; Canada, contains information licensed under the Open Government Licence – Canada; Europe, produced using Copernicus data and information funded by the European Union, EU-DEM layers; global ETOPO1, U.S. National Oceanic and Atmospheric Administration; Mexico, INEGI Continental relief 2016; New Zealand, Copyright 2011 Crown copyright (c) Land Information New Zealand and the New Zealand Government (All rights reserved); Norway © Kartverket; United Kingdom © Environment Agency copyright and/or database right 2015, all rights reserved; United States 3DEP (formerly NED) and global GMTED2010 and SRTM, courtesy of the U.S. Geological Survey.
Elevation fill: produced using Copernicus WorldDEM-30 © DLR e.V. 2010-2014 and © Airbus Defence and Space GmbH 2014-2018 provided under COPERNICUS by the European Union and ESA; all rights reserved. The organisations in charge of the Copernicus programme by law or by delegation do not incur any liability for any use of the Copernicus WorldDEM-30.
United States: USGS 3D Elevation Program 1/3 arc-second DEM (public domain), courtesy of the U.S. Geological Survey.
Antarctica: Reference Elevation Model of Antarctica (REMA) v2.0, Polar Geospatial Center, University of Minnesota (CC BY 4.0); Howat, I., et al. (2022), The Reference Elevation Model of Antarctica - Mosaics, Version 2, Harvard Dataverse, https://doi.org/10.7910/DVN/EBW8UC. DEMs provided by the Byrd Polar and Climate Research Center and the Polar Geospatial Center under NSF-OPP awards 1043681, 1542736, 1543501, 1559691, 1810976, and 2129685. Geoid: EGM96 (NGA, public domain), shipped as a half-degree grid south of 50 S in geography/src/main/resources.
Land cover: © ESA WorldCover project 2021 / Contains modified Copernicus Sentinel data (2021) processed by ESA WorldCover consortium. Zanaga, D. et al. (2022), ESA WorldCover 10 m 2021 v200, doi:10.5281/zenodo.7254221. CC BY 4.0.
Climate: CHELSA V2.1 climatologies 1981-2010. Karger, D.N. et al. (2017) Climatologies at high resolution for the earth's land surface areas, Scientific Data 4:170122; Karger et al. (2021) EnviDat, doi:10.16904/envidat.228. CC0 1.0.
Rivers: JRC Global Surface Water v1.4 (Source: EC JRC/Google; Pekel et al. 2016, Nature 540, 418-422), Copernicus Programme. The European Union and the organisations in charge of the Copernicus programme do not incur any liability for any use of these data.
Ecoregions: RESOLVE Ecoregions 2017, Dinerstein et al. 2017, An Ecoregion-Based Approach to Protecting Half the Terrestrial Realm, BioScience 67(6):534-545, CC BY 4.0; derived 0.05 degree raster.
Ground colours (optional, off by default): Sentinel-2 cloudless 2016, EOxCloudless - https://cloudless.eox.at by EOX IT Services GmbH (Contains modified Copernicus Sentinel data 2016).
Spawn picker globe (bundled): NASA Earth Observatory, Reto Stöckli, Blue Marble Next Generation (July 2004), public domain.
Distant terrain: built on ideas from Voxy by Cortex (MCRcortex) and Distant Horizons by James Seibel and contributors: the voxel level pyramid, detail by on-screen size, compact GPU faces and Voxy's shader-pack interface from Voxy; exact far heights and server-built far terrain from Distant Horizons. Thank you to both. We'd have recommended using them directly, but neither works with a cubic-chunks world, so Earth Platform has its own renderer. It contains no code from either.
Earth Platform changes these data (resampling, block choices, procedural detail); it is not a survey and not for navigation. Not an official Minecraft product. Not approved by or associated with Mojang or Microsoft.''' #optional

# The authors of the mod, displayed in the mod UI (optional)
authors="pirut"

# The description text for the mod (multi line!) (#mandatory)
description='''
The real Earth in Minecraft at true scale: every mountain at its real height, real climate and biomes, and terrain all the way to the horizon.
Choose the Earth world type in Create World and pick where to start. Travel anywhere with /earth visit <place> or /earth goto <latitude> <longitude>.
'''

# The [[mixins]] block allows you to declare your mixin config to FML so that it gets loaded.
[[mixins]]
config="${mod_id}.mixins.json"

# One cubic core: true-height cube storage behind the vanilla Level API.
[[mixins]]
config="${mod_id}.cubic.mixins.json"

# The [[accessTransformers]] block allows you to declare where your AT file is.
# If this block is omitted, a fallback attempt will be made to load an AT from META-INF/accesstransformer.cfg
#[[accessTransformers]]
#file="META-INF/accesstransformer.cfg"

# A dependency - use the . to indicate dependency for a specific modid. Dependencies are optional.
[[dependencies.${mod_id}]] #optional
    # the modid of the dependency
    modId="neoforge" #mandatory
    # The type of the dependency. Can be one of "required", "optional", "incompatible" or "discouraged" (case insensitive).
    # 'required' requires the mod to exist, 'optional' does not
    # 'incompatible' will prevent the game from loading when the mod exists, and 'discouraged' will show a warning
    type="required" #mandatory
    # Optional field describing why the dependency is required or why it is incompatible
    # reason="..."
    # The version range of the dependency
    versionRange="${neo_version_range}" #mandatory
    # An ordering relationship for the dependency.
    # BEFORE - This mod is loaded BEFORE the dependency
    # AFTER - This mod is loaded AFTER the dependency
    ordering="NONE"
    # Side this dependency is applied on - BOTH, CLIENT, or SERVER
    side="BOTH"

# Here's another dependency
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    # This version range declares a minimum of the current minecraft version up to but not including the next major version
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Features are specific properties of the game environment, that you may want to declare you require. This example declares
# that your mod requires GL version 3.2 or higher. Other features will be added. They are side aware so declaring this won't
# stop your mod loading on the server for example.
#[features.${mod_id}]
#openGLVersion="[3.2,)"

# These remain separately installed optional inputs. Players update Sodium and Iris on their own
# (Sodium Extra needs Sodium 0.8.13), so any 0.8.x Sodium and 1.8.x Iris from the tested ones up loads.
[[dependencies.${mod_id}]]
    modId="iris"
    type="optional"
    versionRange="[1.8.14-beta.1+mc1.21.1,1.9)"
    ordering="AFTER"
    side="CLIENT"
[[dependencies.${mod_id}]]
    modId="sodium"
    type="optional"
    versionRange="[0.8.12-beta.1+mc1.21.1,0.9)"
    ordering="AFTER"
    side="CLIENT"

# Both explicit native-player diagnostic and GameTest-server flags are required by its plugin.
[[mixins]]
config="earthplatform.native-player-tick-diagnostic.mixins.json"

# Held native-session fixture only; both explicit bridge and GameTest-server flags required.
[[mixins]]
config="earthplatform.native-session-bridge.mixins.json"

# Explicit ordinary LocalChannel observation; production flags must remain closed.
[[mixins]]
config="earthplatform.native-local-observation.mixins.json"
