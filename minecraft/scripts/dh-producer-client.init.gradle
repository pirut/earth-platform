// Explicit diagnostic-only variant. No new classes enter the ordinary release JAR.
allprojects { p ->
    p.plugins.withId('net.neoforged.moddev') {
        if (p.providers.gradleProperty('earthDhProducerClient').getOrElse('false') != 'true') return
        def fixture = p.sourceSets.create('dhProducerClient') {
            java.setSrcDirs([p.file('src/dhProducerClient/java'), p.file('src/test/java')])
            java.include('io/earthplatform/compat/dh/InstalledSurvivalDhProducerClient.java',
                    'io/earthplatform/compat/dh/InstalledSurvivalDhProducerClientBody.java',
                    'io/earthplatform/compat/dh/IntegratedProducerRequestGate.java',
                    'io/earthplatform/minecraft/lod/SurvivalDhProducerGpuFixture.java',
                    'io/earthplatform/minecraft/survival/dhfixture/DhProducerFixtureAssertions.java',
                    'io/earthplatform/minecraft/survival/render/SurvivalDhTestSupport.java')
            resources.setSrcDirs([])
            compileClasspath += p.sourceSets.main.output + p.sourceSets.main.compileClasspath
            runtimeClasspath += p.sourceSets.main.runtimeClasspath
        }
        p.tasks.named(fixture.compileJavaTaskName).configure {
            dependsOn('verifyOfficialDhInput', 'verifyOfficialShaderInputs')
            doFirst {
                if (fixture.java.files.size() != 6 || fixture.java.files.any { it.text.contains('org.junit') })
                    throw new GradleException('Integrated producer must compile exactly six no-JUnit sources')
                def tests = p.sourceSets.test.output.files.collect { it.canonicalFile }
                if (fixture.runtimeClasspath.files.any { tests.contains(it.canonicalFile) })
                    throw new GradleException('No JUnit output may enter installed client')
            }
        }
        // This gate is deliberately plain Java. Only normal MDG tests own mainargs/FML startup.
        def automaticFml = p.configurations.testRuntimeClasspath.incoming.artifactView {
            componentFilter { id -> id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier
                    && id.group == 'net.neoforged.fancymodloader' && id.module == 'junit-fml' }
        }.files
        def units = p.sourceSets.create('dhProducerClientUnit') {
            java.setSrcDirs([p.file('src/dhProducerClientUnit/java'), p.file('src/dhProducerClient/java')])
            java.include('io/earthplatform/compat/dh/IntegratedProducerRequestGate.java',
                    'io/earthplatform/compat/dh/IntegratedProducerRequestGateTest.java')
            resources.setSrcDirs([])
            compileClasspath = p.configurations.testCompileClasspath
            runtimeClasspath = output + (p.configurations.testRuntimeClasspath - automaticFml)
        }
        p.tasks.register('dhProducerClientUnitTest', Test) {
            dependsOn(p.tasks.named(units.classesTaskName))
            testClassesDirs = units.output.classesDirs
            classpath = units.runtimeClasspath
            useJUnitPlatform()
            maxHeapSize = '512m'
            maxParallelForks = 1
            systemProperty('producerSourceRoot', p.file('src/dhProducerClient/java').absolutePath)
            testLogging { events 'passed', 'failed', 'skipped' }
        }
        p.tasks.register('dhProducerClientJar', Jar) {
            dependsOn(p.tasks.named('classes'), p.tasks.named(fixture.classesTaskName))
            archiveClassifier = 'dh-producer-client-diagnostic'
            duplicatesStrategy = DuplicatesStrategy.FAIL
            from(p.sourceSets.main.output)
            from(fixture.output)
            manifest.attributes('Earth-Platform-Artifact': 'original-dh-producer-client-diagnostic',
                    'Earth-Platform-Upstream-Bundled': 'false', 'Earth-Platform-Gameplay-Qualification': 'none')
            doLast {
                def zip = new java.util.zip.ZipFile(archiveFile.get().asFile)
                try {
                    def names = zip.entries().collect { it.name }
                    if (!names.contains('META-INF/neoforge.mods.toml') ||
                            !names.contains('io/earthplatform/compat/dh/InstalledSurvivalDhProducerClient.class') ||
                            names.any { it.startsWith('org/junit/') || it.contains('InstalledSurvivalDhProducerGameTests') })
                        throw new GradleException('Diagnostic variant payload mismatch')
                } finally { zip.close() }
            }
        }
    }
}
