plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

// Isolate headless probes from a long-running development client and its Gradle project lock.
layout.buildDirectory = file(providers.gradleProperty('earthBuildDirectory').getOrElse('build'))

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.
}

base {
    archivesName = mod_id
}

// Original shim metadata also keeps the output manifest distinct from generic
// manifests in upstream nested jars; those bytes remain covered by the scanner.
// LGPL-3.0 section 4 asks that the jar carry the LGPL and the GPL it refers to.
def licenceNotice = tasks.register('licenceNotice') {
    def lgpl = file('../LICENSE')
    def gpl = file('../COPYING')
    def out = layout.buildDirectory.file('generated/licence/earthplatform-LICENSE.txt')
    inputs.files(lgpl, gpl)
    outputs.file(out)
    doLast {
        out.get().asFile.text = 'Earth Platform is free software: you can redistribute it and/or modify it under the terms of\n' +
                'the GNU Lesser General Public License version 3 (LGPL-3.0-only), which follows, together with\n' +
                'the GNU General Public License version 3 it builds on. The Earth data it downloads or bundles\n' +
                'keeps its own terms, credited in CREDITS.md and on the mod\'s Mods screen.\n\n' +
                lgpl.getText('UTF-8') + '\n\n' + gpl.getText('UTF-8')
    }
}

tasks.named('jar', Jar) {
    manifest.attributes('Earth-Platform-Artifact': 'original-shader-compatibility-shim',
            'Earth-Platform-Upstream-Bundled': 'false')
    from(licenceNotice) { into 'META-INF' }
}

// The jar records the commit it was built from, for the local performance log. A source download
// without git (or outside a checkout) builds too, as "unknown".
def sourceCommit = providers.gradleProperty('earthBuildCommit').getOrNull()
if (sourceCommit == null) {
    try {
        sourceCommit = providers.exec {
            commandLine 'git', 'rev-parse', 'HEAD'
            ignoreExitValue = true
        }.standardOutput.asText.get().trim()
    } catch (Exception ignored) {
        sourceCommit = 'unknown'
    }
}
if (!(sourceCommit ==~ /[a-f0-9]{40}/)) sourceCommit = 'unknown'
def generateBuildIdentity = tasks.register('generateBuildIdentity') {
    def out = layout.buildDirectory.file('generated/buildIdentity/META-INF/earthplatform-build.properties')
    inputs.property('commit', sourceCommit)
    inputs.property('version', project.version.toString())
    outputs.file(out)
    doLast {
        def target = out.get().asFile
        target.parentFile.mkdirs()
        target.text = 'commit=' + sourceCommit + '\nversion=' + project.version +
                '\nflavor=current\ndiagnostics=true\n'
    }
}
sourceSets.main.resources.srcDir layout.buildDirectory.dir('generated/buildIdentity')
tasks.named('processResources') { dependsOn generateBuildIdentity }

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Authorized disposable shader baseline; engine resource caps are unchanged.
            jvmArgument '-Xmx4G'
        }

        data {
            data()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// The cubic engine. It is bundled inside the jar (jar-in-jar), so players still install one file;
// a newer Chunks3 another mod ships wins, within chunks3_version_range.
dependencies {
    jarJar(implementation("io.github.pirut:chunks3")) {
        version {
            strictly project.chunks3_version_range
            prefer project.chunks3_version
        }
    }
}

// Exact, independently installed shader inputs. Nothing is resolved from a Maven
// coordinate, downloaded, extracted, installed, shaded, or added to localRuntime.
def officialIrisJar = providers.gradleProperty('installedIrisJar')
        .orElse(providers.environmentVariable('EARTH_INSTALLED_IRIS_JAR'))
        .orElse(providers.systemProperty('earthplatform.installedIrisTestJar'))
def officialSodiumJar = providers.gradleProperty('installedSodiumJar')
        .orElse(providers.environmentVariable('EARTH_INSTALLED_SODIUM_JAR'))
        .orElse(providers.systemProperty('earthplatform.installedSodiumTestJar'))
def officialShaderPack = providers.gradleProperty('installedShaderPack')
        .orElse(providers.environmentVariable('EARTH_INSTALLED_SHADER_PACK'))
        .orElse(providers.systemProperty('earthplatform.installedShaderTestPack'))
def officialIrisFiles = files(officialIrisJar.map { file(it) })
def officialSodiumFiles = files(officialSodiumJar.map { file(it) })
def officialShaderPackFiles = files(officialShaderPack.map { file(it) })
def officialShaderInputs = [
        iris: [provider:officialIrisJar, files:officialIrisFiles, version:'1.8.14-beta.1+mc1.21.1', size:2540723L,
               sha256:'60d5f8bf52f25e9986440f4a4270a6bd986d9cff994510e1108ac1547063b314'],
        sodium: [provider:officialSodiumJar, files:officialSodiumFiles, version:'0.8.12-beta.1+mc1.21.1', size:1291422L,
                 sha256:'dc2838d5538db39414171fe86586ab89d1a30d2fd97f59229cc44cf3777f569d'],
        photon: [provider:officialShaderPack, files:officialShaderPackFiles, version:'v1.3b', size:3800987L,
                 sha256:'120897768eaa8cb1f14a3e98f88dff009ae3204ee3b96904a4fe8586edfc1ead']
]
def verifyOfficialShaderInputs = tasks.register('verifyOfficialShaderInputs') {
    group = 'verification'
    description = 'Verify exact separately supplied Iris, Sodium and Photon files without fetching or installing them.'
    officialShaderInputs.each { name, spec ->
        inputs.files(spec.files).withPropertyName('official_' + name)
        inputs.property(name + '_sha256', spec.sha256)
    }
    doLast {
        officialShaderInputs.each { name, spec ->
            if (!spec.provider.isPresent())
                throw new GradleException('Supply the unchanged external ' + name + ' artifact using installedIrisJar, installedSodiumJar and installedShaderPack properties or EARTH_INSTALLED_IRIS_JAR, EARTH_INSTALLED_SODIUM_JAR and EARTH_INSTALLED_SHADER_PACK. This shim does not download or bundle upstream inputs.')
            def supplied = file(spec.provider.get())
            if (!supplied.isFile() || supplied.length() != spec.size)
                throw new GradleException('Missing or unsupported separately supplied ' + name + ' artifact: ' + supplied)
            def actual = java.security.MessageDigest.getInstance('SHA-256').digest(supplied.bytes).encodeHex().toString()
            if (actual != spec.sha256)
                throw new GradleException(name + ' artifact SHA-256 mismatch: expected ' + spec.sha256 + ', got ' + actual)
        }
    }
}
dependencies {
    compileOnly officialIrisFiles
    compileOnly officialSodiumFiles
    testCompileOnly officialIrisFiles
    testCompileOnly officialSodiumFiles
}
// Photon is a verified data input only; it is never on any JVM classpath.
tasks.named('compileJava') { dependsOn verifyOfficialShaderInputs }
tasks.named('compileTestJava') { dependsOn verifyOfficialShaderInputs }

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            chunks3_version_range  : chunks3_version_range,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
// Iris and Sodium are compile-only for tests too; no optional upstream class is ever on a test classpath.
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    dependsOn verifyOfficialShaderInputs
    systemProperty 'earthplatform.test.projectDirectory', layout.projectDirectory.asFile.absolutePath
    systemProperty 'earthplatform.test.minecraftJar', layout.buildDirectory.file("moddev/artifacts/neoforge-${neo_version}-merged.jar").get().asFile.absolutePath
    [[officialIrisJar, 'earthplatform.installedIrisTestJar'],
     [officialSodiumJar, 'earthplatform.installedSodiumTestJar'],
     [officialShaderPack, 'earthplatform.installedShaderTestPack']].each { input ->
        if (input[0].isPresent()) systemProperty input[1], file(input[0].get()).absolutePath
    }
    testLogging { events 'passed', 'skipped', 'failed'; showStandardStreams = true }
}
tasks.named('test', Test) {
    description = 'Run the engine tests without the separately supplied shader mods.'
}

neoForge {
    unitTest {
        enable()
        testedMod = mods.earthplatform
    }
}

sourceSets.main.java.srcDir '../geography/src/main/java'
sourceSets.main.resources.srcDir '../geography/src/main/resources'

// Resolve supported dev-client dependencies without opening a window or starting a server.
// Useful when the native desktop terminal is offline but the managed build executor can fetch artifacts.
tasks.register('resolveClientRuntime') {
    doLast { println("Resolved client runtime files: " + configurations.runtimeClasspath.files.size()) }
}


// Iris and Sodium stay compile-only and Photon stays off every JVM classpath.
def verifyShaderBuildContract = tasks.register('verifyShaderBuildContract') {
    group = 'verification'
    dependsOn verifyOfficialShaderInputs
    doLast {
        def canonicalFiles = { collection -> collection.files.collect { it.canonicalFile } as Set }
        def shaderMods = [file(officialIrisJar.get()).canonicalFile, file(officialSodiumJar.get()).canonicalFile] as Set
        def photon = file(officialShaderPack.get()).canonicalFile
        for (def compile : [configurations.compileClasspath, configurations.testCompileClasspath]) {
            if (!canonicalFiles(compile).containsAll(shaderMods))
                throw new GradleException('Exact external Iris and Sodium inputs must remain compile-only dependencies.')
        }
        for (def runtime : [configurations.runtimeClasspath, configurations.testRuntimeClasspath, tasks.named('test', Test).get().classpath]) {
            if (!Collections.disjoint(canonicalFiles(runtime), shaderMods))
                throw new GradleException('Shader inputs leaked into a runtime classpath.')
            if (canonicalFiles(runtime).contains(photon))
                throw new GradleException('Photon is a separate data input and must never be placed on a JVM classpath.')
        }
        def test = tasks.named('test', Test).get()
        if (!test.filter.includePatterns.isEmpty() || !test.filter.excludePatterns.isEmpty()
                || !test.filter.commandLineIncludePatterns.isEmpty())
            throw new GradleException('A filtered test invocation cannot issue the complete shader shim verification receipt.')
    }
}

// Distribution is only our shim. Each upstream file stays independently installed.
// Detect forbidden paths and unchanged upstream entries, including nested Sodium
// classes. Nested archives are read in memory; no upstream entry is written out.
tasks.register('verifyShimArtifact') {
    dependsOn tasks.named('jar'), tasks.named('test'), verifyShaderBuildContract
    doLast {
        def partitions = [tasks.named('test', Test).get()]
        def partitionResults = [:]
        partitions.each { partition ->
            int testCount = 0
            if (!partition.state.executed || partition.state.failure != null
                    || partition.state.skipped && !partition.state.upToDate && partition.state.skipMessage != 'FROM-CACHE')
                throw new GradleException('A skipped, excluded or failed test partition cannot issue a release receipt: ' + partition.name)
            def resultFiles = fileTree(partition.reports.junitXml.outputLocation.get().asFile) { include 'TEST-*.xml' }.files
            if (resultFiles.isEmpty()) throw new GradleException('Missing XML results for required partition: ' + partition.name)
            resultFiles.each { result ->
                def xml = new groovy.xml.XmlSlurper().parse(result)
                testCount += xml.@tests.toInteger()
                // Opt-in benchmarks and tests that need a supplied file skip themselves; failures still stop the receipt.
                if (xml.@failures.toInteger() != 0 || xml.@errors.toInteger() != 0)
                    throw new GradleException('Required partition has failures or errors: ' + result)
            }
            if (testCount == 0) throw new GradleException('Required partition executed zero tests: ' + partition.name)
            partitionResults[partition.name] = [tests:testCount, failures:0, errors:0]
        }
        def artifact = tasks.named('jar').get().archiveFile.get().asFile
        def failures = []
        int entries = 0
        def upstreamPayloads = [:]
        def upstreamInputs = officialShaderInputs
        def fingerprint = { byte[] bytes, String origin ->
            if (bytes.length > 0) {
                def hash = java.security.MessageDigest.getInstance('SHA-256').digest(bytes).encodeHex().toString()
                upstreamPayloads.putIfAbsent(hash, origin)
            }
        }
        Closure fingerprintNestedArchive
        fingerprintNestedArchive = { byte[] archiveBytes, String origin ->
            new java.util.zip.ZipInputStream(new ByteArrayInputStream(archiveBytes)).withCloseable { nested ->
                java.util.zip.ZipEntry entry
                while ((entry = nested.nextEntry) != null) {
                    if (!entry.directory) {
                        def bytes = nested.readAllBytes()
                        def name = origin + '!/' + entry.name
                        fingerprint(bytes, name)
                        if (entry.name.toLowerCase(java.util.Locale.ROOT).endsWith('.jar')
                                || entry.name.toLowerCase(java.util.Locale.ROOT).endsWith('.zip'))
                            fingerprintNestedArchive(bytes, name)
                    }
                    nested.closeEntry()
                }
            }
        }
        upstreamInputs.each { name, spec ->
            def supplied = file(spec.provider.get())
            fingerprint(supplied.bytes, name + ' entire artifact')
            new java.util.zip.ZipFile(supplied).withCloseable { upstream ->
                upstream.entries().each { entry ->
                    if (!entry.directory) upstream.getInputStream(entry).withCloseable { input ->
                        def bytes = input.readAllBytes()
                        def origin = name + '!/' + entry.name
                        fingerprint(bytes, origin)
                        if (entry.name.toLowerCase(java.util.Locale.ROOT).endsWith('.jar')
                                || entry.name.toLowerCase(java.util.Locale.ROOT).endsWith('.zip'))
                            fingerprintNestedArchive(bytes, origin)
                    }
                }
            }
        }
        // The one nested jar allowed is Chunks3, our own engine (jar-in-jar); its entries are checked too.
        def ownNested = { String path -> path ==~ /meta-inf\/jarjar\/io\.github\.pirut\.chunks3-[0-9a-z.+-]+\.jar/ }
        def inspect
        inspect = { String name, boolean isDirectory, byte[] payload ->
            entries++
            def path = name.toLowerCase(java.util.Locale.ROOT).replaceFirst(/^.*!\//, '')
            if (path.endsWith('.class') && path.contains(' ')) failures.add('invalid duplicate class filename: ' + name)
            if (path.startsWith('net/neoforged/') || path.startsWith('net/minecraft/')
                    || path.startsWith('com/mojang/') || path.startsWith('com/seibel/') || path.startsWith('com/distanthorizons/')
                    || path.startsWith('net/irisshaders/') || path.startsWith('net/caffeinemc/')
                    || path.startsWith('assets/distanthorizons/') || path.startsWith('distanthorizons/')
                    || path.startsWith('assets/iris/') || path.startsWith('assets/sodium/')
                    || path.startsWith('photon/') || path.startsWith('shaders/') || path.startsWith('shaderpacks/')
                    || path.startsWith('runtime-inputs/') || (path.endsWith('.jar') && !(!name.contains('!/') && ownNested(path))) || path.endsWith('.zip')
                    || path.endsWith('.java') && (path.contains('/seibel/') || path.contains('distanthorizons')
                    || path.contains('/irisshaders/') || path.contains('/caffeinemc/') || path.contains('/photon/')))
                failures.add(name)
            if (!isDirectory && payload.length > 0) {
                def digest = java.security.MessageDigest.getInstance('SHA-256').digest(payload).encodeHex().toString()
                if (upstreamPayloads.containsKey(digest)) failures.add('copied upstream payload: ' + name + ' matches ' + upstreamPayloads[digest])
            }
            if (!name.contains('!/') && ownNested(path)) {
                new java.util.zip.ZipInputStream(new ByteArrayInputStream(payload)).withCloseable { nested ->
                    java.util.zip.ZipEntry inner
                    while ((inner = nested.nextEntry) != null) {
                        inspect(name + '!/' + inner.name, inner.directory, inner.directory ? new byte[0] : nested.readAllBytes())
                        nested.closeEntry()
                    }
                }
            }
        }
        new java.util.zip.ZipFile(artifact).withCloseable { zip ->
            zip.entries().each { entry ->
                byte[] payload = entry.directory ? new byte[0] : zip.getInputStream(entry).withCloseable { it.readAllBytes() }
                inspect(entry.name, entry.directory, payload)
            }
        }
        sourceSets.main.allJava.files.each { source ->
            def text = source.getText('UTF-8')
            if (text =~ /(?m)^\s*package\s+(com\.seibel|com\.distanthorizons|net\.irisshaders|net\.caffeinemc|net\.neoforged|net\.minecraft|com\.mojang)\b/)
                failures.add('upstream namespace source: ' + source.name)
        }
        if (!failures.isEmpty()) throw new GradleException('Shim artifact contains forbidden upstream payloads: ' + failures)
        def sha = java.security.MessageDigest.getInstance('SHA-256').digest(artifact.bytes).encodeHex().toString()
        def report = layout.buildDirectory.file('reports/shim-artifact.json').get().asFile
        report.parentFile.mkdirs()
        report.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                status:'PASS_NO_BUNDLED_UPSTREAM_PAYLOAD', artifact:artifact.name, sha256:sha, inspectedEntries:entries,
                externalUpstreamInputs:upstreamInputs.collectEntries { name, spec -> [(name):[version:spec.version, sha256:spec.sha256]] },
                fingerprintedPayloads:upstreamPayloads.size(),
                requiredTestPartitions:['test'],
                partitionResults:partitionResults, totalTests:partitionResults.values().sum { it.tests },
                runtimeDependency:'Player supplies Iris, Sodium and Photon separately; no bundled or automatically downloaded upstream payload.',
                scope:'Namespace/resource/archive exclusion and exact upstream/nested-entry fingerprint scan; the unfiltered zero-skip headless test task required. Actual installed-mod startup/render/reload remains a separate runtime proof.'])) + '\n'
    }
}
tasks.named('check') { dependsOn tasks.named('verifyShimArtifact') }
