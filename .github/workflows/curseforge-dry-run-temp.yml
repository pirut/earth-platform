# TEMPORARY: one-time backfill of build 73 to CurseForge from this branch. Remove right after it runs.
name: CurseForge dry run (temporary)
on:
  push:
    branches: [claude/project-thread-jpqgxa]
permissions:
  contents: read
jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Upload build 73's jars (JR picked build 73 only)
        env:
          GH_TOKEN: ${{ github.token }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT: ${{ vars.CURSEFORGE_PROJECT || secrets.CURSEFORGE_PROJECT }}
          CURSEFORGE_DRY_RUN: '0'
        run: |
          [ -n "$CURSEFORGE_TOKEN" ] && echo "CURSEFORGE_TOKEN is set" || echo "::error::CURSEFORGE_TOKEN is missing"
          [ -n "$CURSEFORGE_PROJECT" ] && echo "CURSEFORGE_PROJECT=$CURSEFORGE_PROJECT" || echo "::error::CURSEFORGE_PROJECT is missing"
          mkdir d && gh release download combined-73 --repo "$GITHUB_REPOSITORY" --dir d --pattern 'earthplatform-*combined-73.jar'
          TAG=combined-73 VERSION=0.1.0-alpha.73 bash .github/scripts/curseforge-upload.sh d
