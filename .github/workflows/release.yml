# Builds the mod jar and publishes it as a GitHub release.
# Every push to main releases the newest build: the highest docs/release/notes/combined-NN.md names
# the tag. When that release already exists the run only makes sure it is the repository's Latest
# release (so the Releases box on the repository page shows it) and stops; docs-only merges build nothing.
# Releases are full releases marked Latest, not pre-releases: GitHub leaves pre-releases out of the
# Releases box, so a pre-release made the repository page show only "1 tag".
# Third-party actions are pinned to full commit SHAs (the tag each SHA was taken from is in the comment).
# A pushed combined-NN tag, or a run by hand from the Actions tab with a tag name, still works too.
name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'combined-*'
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (for example combined-34). Builds the chosen branch and creates the tag there if it does not exist yet.
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The cubic engine (Chunks3) is a submodule.
          submodules: true

      - name: Pick the tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          # The release title shows the mod version once it is a public one (not the old "-engine-prototype").
          version=$(sed -n 's/^mod_version=//p' minecraft/gradle.properties)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          name_for() {
            case "$1" in combined-*) build="build ${1#combined-}" ;; *) build="$1" ;; esac
            case "$version" in *prototype*) echo "Earth Platform $build" ;; *) echo "Earth Platform $version ($build)" ;; esac
          }
          if [ -n "$INPUT_TAG" ]; then tag="$INPUT_TAG"
          elif [ "$GITHUB_REF_TYPE" = tag ]; then tag="$GITHUB_REF_NAME"
          else
            tag=$(ls docs/release/notes | sed -n 's/^\(combined-[0-9][0-9]*\)\.md$/\1/p' | sort -t- -k2 -n | tail -1)
            if [ -z "$tag" ]; then echo "No release notes on main; nothing to release."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --prerelease=false --draft=false --latest
              echo "$tag is already released; marked it Latest, nothing else to do."; echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          # A public version 0.1.0-alpha.N (or beta.N) must name the same build N as the combined-N tag.
          n="${version##*[.-]}"
          case "$version:$tag" in
            *-alpha.*:combined-*|*-beta.*:combined-*)
              if [ "$n" != "${tag#combined-}" ]; then
                echo "::error::mod_version $version does not match $tag. Set mod_version to the same build number as the newest docs/release/notes/combined-NN.md."
                exit 1
              fi ;;
          esac
          echo "Releasing $tag"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "TITLE=$(name_for "$tag")" >> "$GITHUB_ENV"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        if: steps.tag.outputs.skip != 'true'
        with:
          distribution: temurin
          java-version: '21'

      # The repository ignores gradle-wrapper.jar, so use a pinned Gradle instead of ./gradlew.
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        if: steps.tag.outputs.skip != 'true'
        with:
          gradle-version: '9.2.1'

      # The build compiles against Iris and Sodium and checks the stock Photon pack, all supplied
      # from outside and verified by SHA-256 (verifyOfficialShaderInputs). None of them is bundled.
      - name: Fetch the external build inputs
        if: steps.tag.outputs.skip != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/inputs" && cd "$RUNNER_TEMP/inputs"
          curl -fsSLo iris.jar 'https://cdn.modrinth.com/data/YL57xq9U/versions/KduFYu4t/iris-neoforge-1.8.14-beta.1%2Bmc1.21.1.jar'
          curl -fsSLo sodium.jar 'https://cdn.modrinth.com/data/AANobbMI/versions/iw5APcWy/sodium-neoforge-0.8.12-beta.1%2Bmc1.21.1.jar'
          curl -fsSLo photon_v1.3b.zip 'https://cdn.modrinth.com/data/lLqFfGNs/versions/gUv7fBPN/photon_v1.3b.zip'
          sha256sum -c - <<'SUMS'
          60d5f8bf52f25e9986440f4a4270a6bd986d9cff994510e1108ac1547063b314  iris.jar
          dc2838d5538db39414171fe86586ab89d1a30d2fd97f59229cc44cf3777f569d  sodium.jar
          120897768eaa8cb1f14a3e98f88dff009ae3204ee3b96904a4fe8586edfc1ead  photon_v1.3b.zip
          SUMS
          {
            echo "EARTH_INSTALLED_IRIS_JAR=$PWD/iris.jar"
            echo "EARTH_INSTALLED_SODIUM_JAR=$PWD/sodium.jar"
            echo "EARTH_INSTALLED_SHADER_PACK=$PWD/photon_v1.3b.zip"
          } >> "$GITHUB_ENV"

      - name: Build and test
        if: steps.tag.outputs.skip != 'true'
        working-directory: minecraft
        env:
          LC_ALL: C.UTF-8
          # ModDevGradle skips recompiling Minecraft when CI=true, and then the merged game jar that
          # the pinned-bytecode tests read (earthplatform.test.minecraftJar) is never made.
          CI: 'false'
        run: gradle --no-daemon --console=plain jar test

      - name: Collect the release files
        if: steps.tag.outputs.skip != 'true'
        run: |
          mkdir dist
          version="$VERSION"
          cp "minecraft/build/libs/earthplatform-$version.jar" "dist/earthplatform-$TAG.jar"
          cp LICENSE COPYING THIRD_PARTY_NOTICES.md CREDITS.md dist/
          ( cd dist && sha256sum "earthplatform-$TAG.jar" > "earthplatform-$TAG.jar.sha256" )
          notes="docs/release/notes/$TAG.md"
          if [ -f "$notes" ]; then cp "$notes" release-notes.md; else echo "Earth Platform $TAG" > release-notes.md; fi
          { echo; echo "Mod version $version, for Minecraft 1.21.1 with NeoForge. Built from $(git rev-parse --short HEAD)."; echo; echo '```'; cat "dist/earthplatform-$TAG.jar.sha256"; echo '```'; } >> release-notes.md

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        if: steps.tag.outputs.skip != 'true'
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.TITLE }}
          body_path: release-notes.md
          prerelease: false
          make_latest: 'true'
          files: dist/*

      # Uploads the same jar to Modrinth (project earth-platform) as an alpha for NeoForge on Minecraft
      # 1.21.1, with the build's notes as the changelog. One jar runs on both client and server.
      # Needs the MODRINTH_TOKEN secret (a Modrinth personal access token with "Create versions");
      # without it the step says so and the GitHub release stands on its own. A version already on
      # Modrinth is left alone, so re-running a release never uploads twice. To retry a failed upload,
      # run this workflow from the Actions tab with the tag (for example combined-63).
      - name: Upload to Modrinth
        if: steps.tag.outputs.skip != 'true'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_PROJECT: YnuWHcwC
        run: |
          if [ -z "$MODRINTH_TOKEN" ]; then
            echo "::notice::No MODRINTH_TOKEN secret, so $TAG was not uploaded to Modrinth."
            exit 0
          fi
          api=https://api.modrinth.com/v2
          agent="$GITHUB_REPOSITORY release workflow"
          status=$(curl -sS -o /dev/null -w '%{http_code}' -A "$agent" -H "Authorization: $MODRINTH_TOKEN" \
            "$api/project/$MODRINTH_PROJECT/version/$VERSION")
          if [ "$status" = 200 ]; then echo "$VERSION is already on Modrinth; nothing to upload."; exit 0; fi
          notes="docs/release/notes/$TAG.md"
          if [ -f "$notes" ]; then changelog=$(cat "$notes"); else changelog="Earth Platform $TAG"; fi
          case "$VERSION" in *-beta.*) type=beta ;; *-alpha.*|*prototype*) type=alpha ;; *) type=release ;; esac
          jar="earthplatform-$TAG.jar"
          jq -n --arg project "$MODRINTH_PROJECT" --arg name "$TITLE" --arg number "$VERSION" \
            --arg changelog "$changelog" --arg type "$type" \
            '{project_id: $project, name: $name, version_number: $number, changelog: $changelog,
              version_type: $type, loaders: ["neoforge"], game_versions: ["1.21.1"], dependencies: [],
              featured: false, status: "listed", file_parts: ["jar"], primary_file: "jar"}' > modrinth-version.json
          curl -sS --fail-with-body -A "$agent" -H "Authorization: $MODRINTH_TOKEN" \
            -F "data=<modrinth-version.json;type=application/json" \
            -F "jar=@dist/$jar;type=application/java-archive" \
            "$api/version" > modrinth-response.json \
            || { cat modrinth-response.json; echo; echo "::error::Modrinth upload of $VERSION failed."; exit 1; }
          echo "Uploaded $VERSION to Modrinth: https://modrinth.com/mod/earth-platform/version/$(jq -r .id modrinth-response.json)"
