# Uploads builds that are already GitHub releases to CurseForge, run by hand from the Actions tab.
# It downloads each release's own jars (nothing is rebuilt, so the files are byte-for-byte the
# GitHub ones) and uploads them with .github/scripts/curseforge-upload.sh, oldest first so the
# newest build ends up on top. Uses the same CURSEFORGE_TOKEN secret and CURSEFORGE_PROJECT
# variable as the Release workflow.
# CurseForge can't tell this workflow which builds it already has, so list only builds it doesn't.
name: CurseForge backfill

on:
  workflow_dispatch:
    inputs:
      tags:
        description: Releases to upload, oldest first, separated by spaces (for example "combined-70 combined-71 combined-72 combined-73")
        required: true

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Upload each release
        env:
          GH_TOKEN: ${{ github.token }}
          TAGS: ${{ github.event.inputs.tags }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT: ${{ vars.CURSEFORGE_PROJECT || secrets.CURSEFORGE_PROJECT }}
        run: |
          if [ -z "$CURSEFORGE_TOKEN" ] || [ -z "$CURSEFORGE_PROJECT" ]; then
            echo "::error::Set the CURSEFORGE_TOKEN secret and the CURSEFORGE_PROJECT variable first."
            exit 1
          fi
          for tag in $TAGS; do
            case "$tag" in combined-[0-9]*) ;; *) echo "::error::$tag is not a combined-NN tag."; exit 1 ;; esac
            dir="backfill/$tag"; mkdir -p "$dir"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$dir" \
              --pattern "earthplatform-$tag.jar" --pattern "earthplatform-fabric-$tag.jar" \
              || { echo "::error::Could not download the jars of $tag."; exit 1; }
            ( cd "$dir" && sha256sum *.jar )
            TAG="$tag" VERSION="0.1.0-alpha.${tag#combined-}" bash .github/scripts/curseforge-upload.sh "$dir"
          done
